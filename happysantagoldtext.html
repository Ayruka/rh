<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Nostalgia Está no Ar!</title>
  <style>
    /* Remove fundo e qualquer centralização */
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Container da tag */
    .gold-tag {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      position: relative;
      padding: 0.25em 0.5em;
      border-radius: 6px;
      display: inline-block; /* Para não ocupar largura total */
    }

    /* Texto dourado com brilho intenso */
    .gold-tag .gold {
      background: linear-gradient(90deg,
        #fff39a 0%,
        #ffeb3b 25%,
        #ffc107 50%,
        #ffeb3b 75%,
        #fff39a 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      position: relative;
      z-index: 2;
      text-shadow: 
        0 0 8px rgba(255,235,59,0.4), 
        0 0 20px rgba(255,193,7,0.25), 
        0 0 28px rgba(255,223,0,0.15);
      animation: shine 2.5s linear infinite;
    }

    /* Glow difuso atrás do texto */
    .gold-tag::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 70%;
      border-radius: 8px;
      filter: blur(22px);
      opacity: 0.8;
      background: radial-gradient(closest-side, rgba(255,240,120,0.45), rgba(255,200,0,0.1) 60%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* Animação de brilho */
    @keyframes shine {
      0%   { background-position: 0% 50%; text-shadow: 0 0 10px rgba(255,235,59,0.45), 0 0 25px rgba(255,193,7,0.25); }
      50%  { background-position: 100% 50%; text-shadow: 0 0 18px rgba(255,255,130,0.55), 0 0 35px rgba(255,220,0,0.28); }
      100% { background-position: 0% 50%; text-shadow: 0 0 10px rgba(255,235,59,0.45), 0 0 25px rgba(255,193,7,0.25); }
    }

    /* Responsivo */
    @media (max-width: 520px) {
      .gold-tag { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <h1 class="gold-tag"><span class="gold">Feliz Natal!</span></h1>

</body>
</html>
