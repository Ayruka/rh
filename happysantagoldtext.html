<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Nostalgia Está no Ar!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    h1 {
      margin: 0;
      padding: 0;
    }

    .gold-tag {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      position: relative;
      display: inline-block;
      border-radius: 6px;

      /* 🔥 Removido o padding que afastava do topo */
      padding: 0;
    }

    .gold-tag .gold {
      background: linear-gradient(90deg,
        #fff39a 0%,
        #ffeb3b 25%,
        #ffc107 50%,
        #ffeb3b 75%,
        #fff39a 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      position: relative;
      z-index: 2;
      text-shadow:
        0 0 8px rgba(255,235,59,0.4),
        0 0 20px rgba(255,193,7,0.25),
        0 0 28px rgba(255,223,0,0.15);
      animation: shine 2.5s linear infinite;
    }

    .gold-tag::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 6px;
      filter: blur(22px);
      opacity: 0.8;
      background: radial-gradient(
        closest-side,
        rgba(255,240,120,0.45),
        rgba(255,200,0,0.1) 60%,
        transparent 70%
      );
      z-index: 1;
      pointer-events: none;
    }

    @keyframes shine {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <h1 class="gold-tag"><span class="gold">Feliz Natal!</span></h1>

</body>
</html>
