<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Barra RGB</title>

<style>
.barra-animada {
    --border-radius: 15px;
    --border-width: 4px;

    position: relative;
    width: 100%;
    padding: 12px;
    text-align: center;

    background-color: #000000;
    color: white;
    font-family: verdana, geneva, sans-serif;
    font-size: 14px;
    font-weight: bold;

    border-radius: var(--border-radius);
    z-index: 1;
    box-sizing: border-box;
}

/* CAIXA DA BORDA */
.barra-animada::after {
    content: "";
    position: absolute;

    /* cola exatamente em cima da barra */
    inset: 0;

    border-radius: inherit; /* copia o border-radius certinho */

    padding: var(--border-width);

    background-image: conic-gradient(
        #488cfb,
        #29dbbc,
        #ddf505,
        #ff9f0e,
        #e440bb,
        #655adc,
        #488cfb
    );

    /* MÁSCARAS - corrigido com versão padrão */
    --m-i: linear-gradient(#000 0 0);
    --m-o: content-box, padding-box;
    -webkit-mask-image: var(--m-i), var(--m-i);
            mask-image: var(--m-i), var(--m-i);
    -webkit-mask-origin: var(--m-o);
            mask-origin: var(--m-o);
    -webkit-mask-clip: var(--m-o);
            mask-clip: content-box, padding-box;
    mask-composite: exclude;
    -webkit-mask-composite: destination-out;

    animation: rotate-hue 2s linear infinite; /* gira sempre */
    filter: hue-rotate(0);

    pointer-events: none; /* não interfere no mouse */
}

/* Animação */
@keyframes rotate-hue {
    to { filter: hue-rotate(1turn); }
}
</style>

</head>
<body>

<div class="barra-animada">
    Tema de hoje
</div>

</body>
</html>
