<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Botão</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden; /* evita scroll */
    height: 60px;     /* altura perfeita pro botão sem cortar */
  }

  .button {
    position: relative;
    width: 120px;
    height: 40px;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 16px;
    margin: 10px;  /* alinhado ao topo + não centraliza */
  }

  .button::before {
    content: '';
    position: absolute;
    left: -4px;
    top: -1px;
    width: 128px;
    height: 48px;
    border-radius: 10px;
    background: linear-gradient(-45deg, #e81cff 0%, #40c9ff 100%);
    z-index: -1;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .button::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient(-45deg, #fc00ff 0%, #00dbde 100%);
    transform: scale(0.95);
    filter: blur(20px);
  }

  .button:hover::after {
    filter: blur(30px);
  }
  .button:hover::before {
    transform: rotate(-180deg);
  }
  .button:active::before {
    scale: 0.7;
  }
</style>
</head>
<body>

<button class="button" onclick="window.open('https://www.youtube.com/watch?v=_ITiwPMUzho', '_blank')">
  Ouvir um Lofi
</button>

</body>
</html>
