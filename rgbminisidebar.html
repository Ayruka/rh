<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Item RGB</title>

<style>
:root{
  --border-radius-right: 18px;
  --border-width: 4px;
}

/* Zera margens globais */
html, body {
    margin: 0;
    padding: 0;
}

/* CAIXA RGB */
.caixa-rgb {
    position: relative;
    display: inline-block;

    height: 40px;
    line-height: 40px;

    padding-left: 12px;
    padding-right: 11px;

    background-color: #000;
    color: white;

    /* só arredondamento do lado direito */
    border-top-right-radius: var(--border-radius-right);
    border-bottom-right-radius: var(--border-radius-right);

    box-shadow: 
        0 2px rgba(0,0,0,.25),
        inset 0 -2px rgba(0,0,0,.2),
        inset 0 -20px rgba(0,0,0,.05);

    vertical-align: baseline;
    box-sizing: border-box;
}

/* BORDA RGB ANIMADA */
.caixa-rgb::after {
    content: "";
    position: absolute;
    inset: 0;

    border-top-right-radius: inherit;
    border-bottom-right-radius: inherit;

    padding: var(--border-width);
    background-image: conic-gradient(
        #488cfb,
        #29dbbc,
        #ddf505,
        #ff9f0e,
        #e440bb,
        #655adc,
        #488cfb
    );

    --m-i: linear-gradient(#000 0 0);
    --m-o: content-box, padding-box;
    -webkit-mask-image: var(--m-i), var(--m-i);
            mask-image: var(--m-i), var(--m-i);
    -webkit-mask-origin: var(--m-o);
            mask-origin: var(--m-o);
    -webkit-mask-clip: var(--m-o);
            mask-clip: content-box, padding-box;
    -webkit-mask-composite: destination-out;
            mask-composite: exclude;

    pointer-events: none;
    animation: rotate-hue 2s linear infinite;
    filter: hue-rotate(0);
}

@keyframes rotate-hue {
    to { filter: hue-rotate(1turn); }
}

/* TEXTO RGB */
.texto-rgb {
    font-family: verdana, geneva, sans-serif;
    font-size: 10pt;
    font-weight: bold;
    display: inline-block;

    color: transparent;
    background-image: conic-gradient(
        #488cfb,
        #29dbbc,
        #ddf505,
        #ff9f0e,
        #e440bb,
        #655adc,
        #488cfb
    );

    -webkit-background-clip: text;
            background-clip: text;

    filter: hue-rotate(0);
    animation: hueText 2s linear infinite;
}

@keyframes hueText {
    to { filter: hue-rotate(1turn); }
}
</style>

</head>
<body>

<div class="caixa-rgb">
    <span class="texto-rgb">Mas o que eles fazem?</span>
</div>

<div>&nbsp;</div>
<div>&nbsp;</div>
<div>&nbsp;</div>

</body>
</html>
